<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 250' width='1200' height='250' role='img' aria-labelledby='t d' font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id='t'>How a person gets into a project online</title><desc id='d'>Four steps along a line. 01 Your account: Google, or an email and a password. 02 The terms: they open the first time, and again when they change; a box gets ticked, I agree. 03 Your role: an invitation for your email, or a project you open; a link and the role it gives, contractor. 04 The team password, for a locked project and its own data: a field fills with dots and a lock opens.</desc>
