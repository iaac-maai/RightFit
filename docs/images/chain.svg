<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 430' width='1200' height='430' role='img' aria-labelledby='t d' font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id='t'>Who invites whom in RightFit online</title><desc id='d'>The consultant opens the project and invites the designer, the site supervisor and the client, who review, and the contractor, who invites its subcontractors. An invitation is a link for one email, valid 14 days, sent by the person who invites. Each subcontractor sees its own branch and never another one's. A locked project opens its packages, files, review and BOQ only with the team password as well, and Management sees people and projects, never the packages.</desc>
<style>.n0{animation:n0 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes n0{0%,3%{opacity:0;transform:translateY(8px)}7%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.chip{animation:chip 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes chip{0%,7%{opacity:0;transform:translateX(-8px)}11%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.w0{animation:w0 12s cubic-bezier(.65,0,.35,1) infinite}@keyframes w0{0%,10%{stroke-dashoffset:1;opacity:0}10.5%{opacity:1}15%,93%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}.n1{animation:n1 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes n1{0%,15%{opacity:0;transform:translateY(8px)}19%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.w1{animation:w1 12s cubic-bezier(.65,0,.35,1) infinite}@keyframes w1{0%,13%{stroke-dashoffset:1;opacity:0}13.5%{opacity:1}18%,93%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}.n2{animation:n2 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes n2{0%,18%{opacity:0;transform:translateY(8px)}22%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.w2{animation:w2 12s cubic-bezier(.65,0,.35,1) infinite}@keyframes w2{0%,16%{stroke-dashoffset:1;opacity:0}16.5%{opacity:1}21%,93%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}.n3{animation:n3 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes n3{0%,21%{opacity:0;transform:translateY(8px)}25%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.w3{animation:w3 12s cubic-bezier(.65,0,.35,1) infinite}@keyframes w3{0%,19%{stroke-dashoffset:1;opacity:0}19.5%{opacity:1}24%,93%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}.n4{animation:n4 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes n4{0%,24%{opacity:0;transform:translateY(8px)}28%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.s0{animation:s0 12s cubic-bezier(.65,0,.35,1) infinite}@keyframes s0{0%,32%{stroke-dashoffset:1;opacity:0}32.5%{opacity:1}37%,93%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}.sub0{animation:sub0 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes sub0{0%,37%{opacity:0;transform:translateY(8px)}41%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.s1{animation:s1 12s cubic-bezier(.65,0,.35,1) infinite}@keyframes s1{0%,36%{stroke-dashoffset:1;opacity:0}36.5%{opacity:1}41%,93%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}.sub1{animation:sub1 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes sub1{0%,41%{opacity:0;transform:translateY(8px)}45%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.apart{animation:apart 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes apart{0%,46%{opacity:0;transform:translateY(8px)}50%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.locked{animation:locked 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes locked{0%,54%{opacity:0;transform:translateY(8px)}58%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.manage{animation:manage 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes manage{0%,60%{opacity:0;transform:translateY(8px)}64%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.land{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
