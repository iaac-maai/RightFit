ransform:none}}.link{animation:link 12s cubic-bezier(.65,0,.35,1) infinite}@keyframes link{0%,16%{stroke-dashoffset:1;opacity:0}16.5%{opacity:1}20%,93%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}.row0{animation:row0 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes row0{0%,36%{opacity:0;transform:translateY(8px)}40%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.confirm{animation:confirm 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes confirm{0%,49%{fill:#4A32B8}53%,100%{fill:#15191A}}.solid{animation:solid 12s cubic-bezier(.65,0,.35,1) infinite}@keyframes solid{0%,51%{stroke-dashoffset:1;opacity:0}51.5%{opacity:1}55%,93%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}.tick{animation:tick 12s cubic-bezier(.65,0,.35,1) infinite}@keyframes tick{0%,49%{stroke-dashoffset:1;opacity:0}49.5%{opacity:1}52%,93%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}.row1{animation:row1 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes row1{0%,39%{opacity:0;transform:translateY(8px)}43%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.stamp{animation:stamp 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes stamp{0%,64%{opacity:0;transform:scale(1.6)}67%,93%{opacity:1;transform:scale(1)}98%,100%{opacity:0;transform:scale(1)}}.noted{animation:noted 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes noted{0%,69%{opacity:0;transform:translateY(8px)}73%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.comment0{animation:comment0 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes comment0{0%,71%{opacity:0;transform:translateX(-6px)}75%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.comment1{animation:comment1 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes comment1{0%,73%{opacity:0;transform:translateX(-6px)}77%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.comment2{animation:comment2 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes comment2{0%,75%{opacity:0;transform:translateX(-6px)}79%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.comment3{animation:comment3 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes comment3{0%,77%{opacity:0;transform:translateX(-6px)}81%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.copy{animation:copy 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes copy{0%,80%{opacity:0;transform:translateY(8px)}84%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.sign{animation:sign 12s cubic-bezier(.65,0,.35,1) infinite}@keyframes sign{0%,83%{stroke-dashoffset:1;opacity:0}83.5%{opacity:1}90%,93%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}.signs{animation:signs 12s cubic-bezier(.16,1,.3,1) infinite}@keyframes signs{0%,88%{opacity:0;transform:translateY(8px)}92%,93%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}.land{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
