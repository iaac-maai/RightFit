# RightFit online updates itself when its code reaches main (docs/workflow.md, section 6): the tests, then the new
# database migrations (each runs once; Cloudflare's d1_migrations table keeps which ran), the checks engine, the site.
# A pull request gets the same tests, with no access to Cloudflare. Secrets on Cloudflare are never changed here.
name: RightFit online

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "app/engine.py"        # the engine is built from these (web/engine/build.py)
      - "app/review_core.py"
      - "app/booster.py"
      - "checks/maf/**"
      - "checks/pumps/**"
      - ".github/workflows/online.yml"
  pull_request:
    paths:
      - "web/**"
      - "app/engine.py"
      - "app/review_core.py"
      - "app/booster.py"
      - "checks/maf/**"
      - "checks/pumps/**"
      - ".github/workflows/online.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: The engine builds
        run: python3 engine/build.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: rightfit-online-deploy
      cancel-in-progress: false  # never stop a deploy halfway
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: New database migrations
        run: npx wrangler d1 migrations apply rightfit-db --remote
      - name: The checks engine, first, since the site's Worker calls it by name
        run: npx wrangler deploy -c wrangler.jsonc
        working-directory: web/engine
      - name: The site
        run: npm run deploy
